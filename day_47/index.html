<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day PLACEHOLDER - JS for 60 days</title>
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Express GET & POST Demo</h1>

    <div class="box">
        <h3>GET Request</h3>
        <input type="text" name="name" id="name" value="" placeholder="Enter your name">
        <button onclick="makeGetRequest()">Test GET</button>
    </div>

    <div class="box">
        <h3>POST Request</h3>
        <input type="text" name="username" id="username" value="" placeholder="Enter your name">
        <button onclick="makePostRequest()">Test POST</button>
    </div>

    <div class="box">
        <h3>Server Response:</h3>
        <pre id="response">Response will appear here...</pre>
    </div>

    <script>
        const display = document.getElementById('response');

        // Function to handle GET
        async function makeGetRequest() {
            const nameValue = document.getElementById('name').value;
            const res = await fetch(`/get?name=${nameValue}`);
            const data = await res.json();
            display.textContent = JSON.stringify(data, null, 2);
        }

        // Function to handle POST
        async function makePostRequest() {
            const nameValue = document.getElementById('username').value;
            
            const res = await fetch('/post', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: nameValue, timestamp: new Date() })
            });
            
            const data = await res.json();
            display.textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
