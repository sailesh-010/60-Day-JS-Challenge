<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 59 - Connecting the Bridge (Fetch API)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input {
            padding: 12px;
            font-size: 16px;
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #output {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            min-height: 40px;
            display: none;
        }
        
        #output.show {
            display: block;
        }
        
        #output.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        #output.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        #output.loading {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        #output h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        #output p {
            margin: 5px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        
        #output ul {
            list-style: none;
            padding-left: 0;
        }
        
        #output li {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        #output strong {
            font-weight: 600;
        }
    </style>
    <script src="index.js"></script>
</head>
<body>
    <div class="container">
        <h1>🔍 Website Scanner</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Enter your URL (e.g., https://example.com)">
            <button id="scanButton">Scan</button>
        </div>
        <div id="output"></div>
    </div>
</body>
</html>
